<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>真大侠 · 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf9f3;--ink:#171d20;--ink2:#727a78;--red:#d82b1d;--indigo:#354b64;--gold:#ad8b48;--amber:#cd913d;
  --brush:'Ma Shan Zheng','STKaiti','KaiTi',serif;--serif:'Noto Serif SC','Songti SC','WenQuanYi Zen Hei',serif}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;color:var(--ink);font-family:var(--serif)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;user-select:none}
.hide{opacity:0!important;pointer-events:none!important}
/* 左上：人物 */
.who{position:absolute;left:28px;top:24px;display:flex;gap:14px;align-items:flex-start}
.seal{width:46px;height:46px;background:var(--red);color:var(--paper);font:40px/46px var(--brush);text-align:center;border-radius:3px 6px 4px 7px;box-shadow:inset 0 0 0 2px rgba(250,249,243,.35)}
.who .nm{font:700 15px var(--serif);letter-spacing:.3em}
.hp{width:min(260px,30vw);height:11px;margin-top:7px;background:rgba(23,29,32,.1);position:relative;clip-path:polygon(0 18%,2% 0,98% 12%,100% 70%,97% 100%,1% 88%)}
.hp i{position:absolute;inset:0;right:auto;background:linear-gradient(90deg,#b8241a,var(--red) 60%,#e2503f);transition:width .15s}
.hp b{position:absolute;inset:0;right:auto;background:rgba(23,29,32,.35);transition:width .6s .2s}
.qg{margin-top:8px;font-size:12px;letter-spacing:.2em;color:var(--ink2);display:flex;align-items:center;gap:8px}
.qg span{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);margin-right:3px}
.qg span.on{background:var(--ink)}
.ups{margin-top:8px;display:flex;gap:6px}
.ups em{font:normal 13px var(--brush);color:var(--red);border:1.5px solid var(--red);padding:1px 6px 0;border-radius:2px;letter-spacing:.1em}
/* 顶部：阵 */
.wave{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
.wave b{font:34px/1 var(--brush);letter-spacing:.2em}
.wave span{display:block;font-size:12px;letter-spacing:.3em;color:var(--ink2);margin-top:4px}
/* 右下：招式 */
.sk{position:absolute;right:28px;bottom:26px;display:flex;gap:12px;align-items:flex-end}
.k{width:58px;height:58px;border-radius:50%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(250,249,243,.75);border:2px solid var(--ink)}
.k b{font:28px/1 var(--brush)} .k kbd{font:600 10px var(--serif);color:var(--ink2);margin-top:2px}
.k i{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(rgba(23,29,32,.55) calc(var(--c,0)*360deg),transparent 0)}
.k.big{width:72px;height:72px;border-color:var(--red)} .k.big b{color:var(--red);font-size:34px}
.keys{position:absolute;left:28px;bottom:24px;font-size:12px;letter-spacing:.14em;color:var(--ink2)}
.keys kbd{font:700 11px var(--serif);color:var(--ink);border:1px solid rgba(23,29,32,.35);padding:0 5px;margin:0 3px;border-radius:2px}
/* 中央横幅 */
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;transition:opacity .5s}
#banner b{font:clamp(54px,8vw,96px)/1 var(--brush);letter-spacing:.24em;margin-right:-.24em;text-shadow:0 0 30px var(--paper),0 0 12px var(--paper)}
#banner span{display:block;margin-top:12px;font-size:14px;letter-spacing:.5em;color:#4b5250;text-shadow:0 0 8px var(--paper)}
/* 标题 */
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(250,249,243,.94) 30%,rgba(250,249,243,.6) 70%);transition:opacity .8s}
#title .t{display:flex;align-items:center;gap:26px}
#title h1{margin:0;font:clamp(80px,13vw,150px)/1 var(--brush);letter-spacing:.12em}
#title .sl{width:64px;height:64px;font-size:54px;line-height:64px}
#title p{margin:16px 0 0;font-size:14px;letter-spacing:.6em;color:#4b5250;text-align:center}
/* 成长卡 */
#cards{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;background:rgba(250,249,243,.55);transition:opacity .3s;pointer-events:auto;padding:0 16px}
#cards .hd{position:absolute;top:18%;left:0;right:0;text-align:center;font:44px var(--brush);letter-spacing:.3em}
.cd{width:min(220px,28vw);min-height:250px;background:var(--paper);border:1.5px solid rgba(23,29,32,.4);padding:22px 20px;box-sizing:border-box;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;box-shadow:0 10px 30px rgba(23,29,32,.12)}
.cd .n{font:46px/1 var(--brush);color:var(--red)} .cd h3{margin:18px 0 10px;font:30px/1.1 var(--brush);letter-spacing:.12em}
.cd p{margin:0;font-size:13px;line-height:1.85;color:#3a403f}
.cd.sel{transform:translateY(-10px);border-color:var(--red);box-shadow:0 18px 40px rgba(216,43,29,.22)}
.cd.sel::after{content:'取';position:absolute;right:14px;bottom:12px;width:34px;height:34px;background:var(--red);color:var(--paper);font:28px/34px var(--brush);text-align:center;border-radius:3px}
/* 伤害墨字 */
.pop{position:absolute;font:28px/1 var(--brush);color:var(--ink);transform:translate(-50%,-50%);text-shadow:0 0 6px var(--paper),0 0 2px var(--paper);opacity:0}
.pop.g{color:var(--gold);font-size:30px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(1.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-130%)}}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(216,43,29,.55);opacity:0}
.capture *{transition:none!important}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:22px var(--brush);color:var(--red);letter-spacing:.3em;transition:opacity .6s}
.cap{position:absolute;right:28px;top:24px;font-size:12px;letter-spacing:.2em;color:var(--ink2);text-align:right;line-height:1.7}
@media (max-width:640px){.keys{display:none}.k{width:46px;height:46px}.k b{font-size:22px}.cd{min-height:200px;padding:14px}.cd h3{font-size:22px}}
</style>
</head><body><canvas id="view" tabindex="0"></canvas>
<div id="ui">
  <div class="who"><div class="seal">真</div><div><div class="nm">红衣剑客</div><div class="hp"><b></b><i></i></div><div class="qg">轻功 <em></em></div><div class="ups"></div></div></div>
  <div class="wave"><b></b><span></span></div>
  <div class="sk"><div class="k" data-k="bash"><i></i><b>盾</b><kbd>L</kbd></div><div class="k" data-k="thrust"><i></i><b>刺</b><kbd>K</kbd></div><div class="k" data-k="leap"><i></i><b>轻</b><kbd>空格</kbd></div><div class="k big" data-k="slash"><i></i><b>斩</b><kbd>J</kbd></div></div>
  <div class="keys"><kbd>WASD</kbd>走位 <kbd>J</kbd>斩 <kbd>K</kbd>刺 <kbd>L</kbd>盾 <kbd>空格</kbd>轻功</div>
  <div id="banner" class="hide"><b></b><span></span></div>
  <div id="toast" class="hide"></div>
  <div id="hurt"></div>
  <div id="cards" class="hide"></div>
  <div id="title"><div><div class="t"><div class="seal sl">真</div><h1>真大侠</h1></div><p>浓墨 · 朱砂 · 身法 · 剑势</p></div></div>
</div>
